# Manually runs database migrations.
#
# Migrations run automatically as part of `deploy-to-aws.yaml` (before the web service is
# updated). Use this only to re-run migrations outside of a deploy. See `_migrate-db.yaml`.

name: Migrate database

on:
  workflow_dispatch:

permissions: {}

jobs:
  migrate:
    name: Migrate database
    uses: ./.github/workflows/_migrate-db.yaml
    permissions:
      id-token: write
      contents: read
    secrets:
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
