# Builds a new docker image, pushes image to ECR, runs database migrations, and deploys new
# image to ECS. Runs when a new release is released.
#
# Order matters: migrations run after the image is pushed (the migration task uses `:latest`)
# but before the web service is updated, so the new app code never runs against an
# un-migrated schema. The old app briefly runs against the new schema instead, so migrations
# must be backwards compatible (additive); see `docs/DATABASE_MANAGEMENT.md`.

name: Deploy to AWS

on:
  release:
    types: [released]
  workflow_dispatch:

env:
  AWS_REGION: 'us-west-2'
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
  AWS_TASK_DEFINITION_FAMILY: 'apportionments-app'
  AWS_ECS_SERVICE: 'apportionments-app'
  AWS_ECS_CLUSTER: 'apportionments-app'
  tf_actions_working_dir: 'tofu'

# Queue deploys rather than cancelling them; cancelling mid-deploy (or mid-migration) can
# leave the service or schema in a broken state.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # These permissions are needed to interact with GitHub's OIDC Token endpoint.
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/github-actions-${{ github.repository_owner }}-${{ github.event.repository.name }}
          aws-region: ${{ env.AWS_REGION }}
          unset-current-credentials: true

      - name: Login to AWS ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Extract metadata tags for Docker
        env:
          IMAGE_TAG: ${{ github.sha }}
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ github.event.repository.name }}
          # Set a latest for default/main branch, and a tag with the commit sha
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Always pull the base image so Node security patches are picked up
          pull: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            SENTRY_RELEASE=${{ github.sha }}
          secrets: |
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}

  migrate:
    name: Migrate database
    needs: build
    uses: ./.github/workflows/_migrate-db.yaml
    permissions:
      id-token: write
      contents: read
    secrets:
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}

  deploy:
    name: Deploy to ECS
    needs: migrate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # These permissions are needed to interact with GitHub's OIDC Token endpoint.
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/github-actions-${{ github.repository_owner }}-${{ github.event.repository.name }}
          aws-region: ${{ env.AWS_REGION }}
          unset-current-credentials: true

      - name: Deploy to Amazon ECS
        run: aws ecs update-service --cluster ${{ env.AWS_ECS_CLUSTER }} --service ${{ env.AWS_ECS_SERVICE }} --force-new-deployment

      - name: Wait for ECS service to stabilize
        run: |
          aws ecs wait services-stable \
            --cluster ${{ env.AWS_ECS_CLUSTER }} \
            --services ${{ env.AWS_ECS_SERVICE }}
        timeout-minutes: 15

  invalidate:
    name: Invalidate Cloudfront
    needs: deploy
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ${{ env.tf_actions_working_dir }}

    # These permissions are needed to interact with GitHub's OIDC Token endpoint.
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials for Tofu
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/github-actions-${{ github.repository_owner }}-${{ github.event.repository.name }}
          aws-region: ${{ env.AWS_REGION }}
          unset-current-credentials: true

      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@v1

      - name: OpenTofu init
        id: init
        working-directory: ${{ env.tf_actions_working_dir }}
        run: tofu init

      # NOTE: Needed to use the stdout output from the tofu commands to set the environment
      # variables. Otherwise GitHub Actions would put the wrong output into the environment
      # variables if i tried to do it directly.
      - name: Set Cloudfront ID
        id: aws_cloudfront_distribution_id
        working-directory: ${{ env.tf_actions_working_dir }}
        run: |
          tofu output --raw cloudfront_distribution_id
      - name: Set Cloudfront ID env
        working-directory: ${{ env.tf_actions_working_dir }}
        run: |
          echo "AWS_CLOUDFRONT_DISTRIBUTION_ID=${{ steps.aws_cloudfront_distribution_id.outputs.stdout }}" >> "$GITHUB_ENV"

      - name: Invalidate Cloudfront
        run: aws cloudfront create-invalidation --distribution-id ${{ env.AWS_CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"
